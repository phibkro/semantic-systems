name: Control Room Static Artifact

# This workflow is intentionally unprivileged. Pull-request code may build and
# test its own candidate, but it receives no Cloudflare secret and performs no
# provider operation. The separate default-branch workflow treats its returned
# static artifact as untrusted data.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  TZ: UTC
  LC_ALL: C.UTF-8

jobs:
  build-static:
    name: build unprivileged static artifact
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: control-room-static-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CONTROL_ROOM_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CONTROL_ROOM_OBSERVATION_SOURCE: ${{ github.event_name == 'pull_request' && 'pr_ci_assertion' || 'main_ci_assertion' }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTROL_ROOM_COMMIT }}
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          source-tag: v3.21.8
          nix-package-url: https://releases.nixos.org/nix/nix-2.34.8/nix-2.34.8-x86_64-linux.tar.xz
          diagnostic-endpoint: ""
      - name: Verify exact candidate checkout
        run: test "${CONTROL_ROOM_COMMIT}" = "$(git rev-parse HEAD)" && test -z "$(git status --porcelain)"
      - name: Install exact dependencies
        run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - name: Attach Effect diagnostics
        run: nix develop --command bun run effect:setup
      - name: Validate repository
        run: nix develop --command just check
      - name: Check and build Control Room
        run: nix develop --command bun run --cwd apps/control-room check
      - name: Exercise root-base mobile PWA
        run: nix develop --command bun run --cwd apps/control-room test:browser
      - name: Scan final public payload
        run: >-
          nix develop --command bun apps/control-room/tooling/scan-public-payload.ts
          "$(pwd)/apps/control-room/dist" "${CONTROL_ROOM_COMMIT}"
      - name: Upload one immutable static artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-room-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/control-room/dist
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 7
