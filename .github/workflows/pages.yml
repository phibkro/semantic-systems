name: Control Room Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact accepted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report exact accepted commit
        run: |
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          printf 'exact-head: %s\n' "${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          source-tag: v3.21.8
          nix-package-url: https://releases.nixos.org/nix/nix-2.34.8/nix-2.34.8-x86_64-linux.tar.xz
          diagnostic-endpoint: ""

      - name: Assert environment and install exact dependencies
        run: |
          test "$(nix --version)" = "nix (Nix) 2.34.8"
          test "$(nix develop --command bun --version)" = "1.3.13"
          nix develop --command bun install --frozen-lockfile --ignore-scripts

      - name: Validate canonical sources
        run: nix develop --command ./scripts/check.sh

      - name: Export exact public snapshot
        env:
          CONTROL_ROOM_COMMIT: ${{ github.sha }}
          CONTROL_ROOM_OBSERVATION_SOURCE: main_ci_assertion
        run: |
          echo "CONTROL_ROOM_OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          CONTROL_ROOM_OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            nix develop --command sh scripts/export-public-model.sh

      - name: Check frontend
        run: |
          nix develop --command bun run --cwd apps/control-room format:check
          nix develop --command bun run --cwd apps/control-room lint
          nix develop --command bun run --cwd apps/control-room typecheck
          nix develop --command bun run --cwd apps/control-room test

      - name: Build Pages payload
        env:
          CONTROL_ROOM_BASE: /semantic-systems/
        run: nix develop --command bun run --cwd apps/control-room build

      - name: Preflight public payload
        run: nix develop --command python scripts/check-public-artifact.py apps/control-room/dist

      - name: Exercise mobile PWA
        run: >-
          nix develop --command apps/control-room/node_modules/.bin/playwright test
          --config apps/control-room/playwright.config.mjs

      - name: Scan final public payload
        run: nix develop --command python scripts/check-public-artifact.py apps/control-room/dist

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload scanned Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/control-room/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact scanned artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
