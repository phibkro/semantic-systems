name: Control Room Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact accepted commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install exact dependencies
        run: |
          python -m pip install -e ".[dev]"
          bun install --frozen-lockfile

      - name: Validate canonical sources
        run: ./scripts/check.sh

      - name: Export exact public snapshot
        env:
          CONTROL_ROOM_COMMIT: ${{ github.sha }}
        run: |
          echo "CONTROL_ROOM_OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          CONTROL_ROOM_OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            sh scripts/export-public-model.sh

      - name: Check frontend
        run: |
          bun run --cwd apps/control-room format:check
          bun run --cwd apps/control-room lint
          bun run --cwd apps/control-room typecheck
          bun run --cwd apps/control-room test

      - name: Build Pages payload
        env:
          CONTROL_ROOM_BASE: /semantic-systems/
        run: bun run --cwd apps/control-room build

      - name: Scan final public payload
        run: PYTHONPATH=src python scripts/check-public-artifact.py apps/control-room/dist

      - name: Install browser runtime
        run: apps/control-room/node_modules/.bin/playwright install --with-deps chromium

      - name: Exercise mobile PWA
        run: >-
          apps/control-room/node_modules/.bin/playwright test
          --config apps/control-room/playwright.config.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload scanned Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/control-room/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact scanned artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
